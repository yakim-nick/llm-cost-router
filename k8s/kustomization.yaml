apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml
  - hpa.yaml
  - pvc.yaml
  - network-policy.yaml

labels:
  - pairs:
      app: llm-router
      managed-by: kustomize

images:
  - name: ghcr.io/yourorg/llm-cost-router
    newTag: latest
