apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-router-ingress
  labels:
    app: llm-router
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - llm-router.example.com
      secretName: llm-router-tls
  rules:
    - host: llm-router.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-router-api
                port:
                  number: 8000
