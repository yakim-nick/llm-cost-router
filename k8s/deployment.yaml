apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router-api
  labels:
    app: llm-router
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-router
      component: api
  template:
    metadata:
      labels:
        app: llm-router
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/yourorg/llm-cost-router:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: llm-router-config
            - secretRef:
                name: llm-router-secrets
          env:
            - name: REDIS_URL
              value: "redis://llm-router-redis:6379/0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-router-db
                  key: database_url
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router-redis
  labels:
    app: llm-router
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-router
      component: redis
  template:
    metadata:
      labels:
        app: llm-router
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args:
            - redis-server
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: llm-router-redis-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router-postgres
  labels:
    app: llm-router
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-router
      component: postgres
  template:
    metadata:
      labels:
        app: llm-router
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: llm_router
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: llm-router-db
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-router-db
                  key: password
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "router"]
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: llm-router-postgres-pvc
