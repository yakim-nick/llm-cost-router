apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-router-redis-pvc
  labels:
    app: llm-router
    component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-router-postgres-pvc
  labels:
    app: llm-router
    component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
